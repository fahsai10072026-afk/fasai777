<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จองโต๊ะ - เรือนรสไท</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-color: #d9534f; }
        body { font-family: 'Kanit', sans-serif; background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; color: var(--primary-color) !important; }
        footer { background-color: #343a40; color: white; padding: 30px 0; }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fa-solid fa-utensils me-2"></i>เรือนรสไท</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">หน้าหลัก</a></li>
                    <li class="nav-item"><a class="nav-link" href="menu.html">เมนูอาหาร</a></li>
                    <li class="nav-item"><a class="nav-link" href="promotion.html">โปรโมชั่น</a></li>
                    <li class="nav-item"><a class="nav-link active" href="reservation.html">จองโต๊ะ</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">ติดต่อเรา</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Form Section -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-0 p-4">
                    <h2 class="text-center fw-bold mb-4 text-danger"><i class="fa-solid fa-calendar-check me-2"></i>สำรองโต๊ะล่วงหน้า</h2>
                    <form onsubmit="alert('ขอบคุณสำหรับการสำรองโต๊ะ! ทางร้านจะติดต่อกลับเพื่อยืนยันอีกครั้งครับ'); return false;">
                        <div class="mb-3">
                            <label class="form-label">ชื่อ-นามสกุล ผู้จอง</label>
                            <input type="text" class="form-control" required placeholder="กรอกชื่อ-นามสกุล">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">เบอร์โทรศัพท์ติดต่อ</label>
                            <input type="tel" class="form-control" required placeholder="08X-XXX-XXXX">
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">วันที่ต้องการจอง</label>
                                <input type="date" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">เวลา</label>
                                <input type="time" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">จำนวนลูกค้า (ท่าน)</label>
                            <select class="form-select" required>
                                <option value="1-2">1 - 2 ท่าน</option>
                                <option value="3-4">3 - 4 ท่าน</option>
                                <option value="5-8">5 - 8 ท่าน</option>
                                <option value="9+">มากกว่า 8 ท่าน</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">คำขอเพิ่มเติม (ถ้ามี)</label>
                            <textarea class="form-control" rows="3" placeholder="เช่น ขอโต๊ะริมหน้าต่าง, แพ้อาหารชนิดใด"></textarea>
                        </div>
                        <button type="submit" class="btn btn-danger w-100 py-2 fw-bold">ยืนยันการจองโต๊ะ</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2026 เรือนรสไท (Ruen Ros Thai). All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
